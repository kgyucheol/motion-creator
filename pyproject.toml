[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.build_meta"

[project]
name = "ramen_controller"
version = "0.1.0"
description = "Task FSM that drives vision, motion and whole-body control for ramen-stack picking (sim2sim and sim2real)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["ramen_controller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
